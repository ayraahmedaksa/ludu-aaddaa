<dialog id="room"><h2 style="margin-top:0">বন্ধুদের সঙ্গে আড্ডা</h2><p>প্রাইভেট রুম ও অনলাইন সংযোগ পরবর্তী ধাপে যোগ হবে। এখন অনুশীলন ম্যাচ খেলতে পারো।</p><button class="primary full" onclick="document.getElementById('room').close();startGame()">অনুশীলন শুরু</button><button class="back full" onclick="document.getElementById('room').close()">বন্ধ করুন</button></dialog>
<script>
const content=document.getElementById('content');let balance=1000;try{balance=Number(localStorage.getItem('luduDemoBalance'))||1000}catch{}let game=null;let timer=null;let page='home';const bn=n=>n.toLocaleString('bn-BD');let soundOn=localStorage.getItem('luduSound')!=='off',musicOn=localStorage.getItem('luduMusic')==='on',vibrationOn=localStorage.getItem('luduVibration')!=='off';let audioCtx=null;let musicTimer=null;function startMusic(){if(!musicOn||musicTimer)return;const play=()=>{if(!musicOn){musicTimer=null;return}beep(262,.18,true);musicTimer=setTimeout(play,1800)};play()}function stopMusic(){clearTimeout(musicTimer);musicTimer=null}function beep(freq=440,duration=.12,force=false){if(!soundOn&&!force)return;audioCtx??=new (window.AudioContext||window.webkitAudioContext)();const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.frequency.value=freq;g.gain.setValueAtTime(.05,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+duration);o.connect(g).connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+duration)}function buzz(ms=35){if(vibrationOn&&navigator.vibrate)navigator.vibrate(ms)}function toggleAudio(k){if(k==='sound')soundOn=!soundOn;if(k==='music'){musicOn=!musicOn;if(musicOn)startMusic();else stopMusic();}if(k==='vibration')vibrationOn=!vibrationOn;localStorage.setItem('ludu'+k[0].toUpperCase()+k.slice(1),k==='sound'?soundOn:k==='music'?musicOn:vibrationOn);render()}
function navigate(next){if(game?.busy&&next==='game')return;page=next;document.querySelector('.app').classList.toggle('king-home',next==='home');document.querySelector('.app').classList.toggle('king-game',next==='game');document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===next));render()}
function render(){if(page==='home')content.innerHTML=`<div class="king-topbar"><button class="king-guest" onclick="navigate(localStorage.getItem('playerToken')?'profile':'auth')"><span>☺</span>অতিথি</button><button class="king-money" onclick="navigate('balance')">৳ ${bn(balance)} <i>＋</i></button><button class="king-settings" onclick="navigate('profile')" aria-label="প্রোফাইল ও সেটিংস">⚙</button></div><div class="king-brand"><span class="brand-crown">♛</span><div class="brand-name"><img class="home-app-icon" src="assets/app-icon.svg" width="48" height="48" alt="">লুডু <span>আড্ডা</span></div><div class="brand-ribbon">বন্ধুদের সঙ্গে, প্রতিটি চালে</div></div><div class="king-illustration" aria-hidden="true"><div class="mini-board"><i></i><i></i><i></i><i></i></div><span class="big-die">⚄</span><span class="art-pawn pawn-red"></span><span class="art-pawn pawn-green"></span><span class="art-pawn pawn-yellow"></span><span class="art-pawn pawn-blue"></span></div><div class="king-modes"><button class="king-mode online" onclick="navigate('lobby')"><span class="mode-art">◎</span><b>অনলাইনে খেলুন</b><small>ম্যাচ লবি দেখুন</small></button><button class="king-mode team" onclick="navigate('lobby')"><span class="mode-art">⚔</span><b>টিম আপ</b><small>টেবিল বেছে নিন</small></button><button class="king-mode friends" onclick="document.getElementById('room').showModal()"><span class="mode-art">♟♟</span><b>বন্ধুদের সঙ্গে</b><small>রুম তৈরি করুন</small></button><button class="king-mode computer" onclick="startGame()"><span class="mode-art versus">VS</span><b>কম্পিউটার</b><small>বিনামূল্যে অনুশীলন</small></button><button class="king-mode local" onclick="navigate('lobby')"><span class="mode-art">♟▣♟</span><b>পাস অ্যান্ড প্লে</b><small>এক ফোনে · শীঘ্রই</small></button></div><button class="king-tournament" onclick="navigate('tournaments')"><span>♜</span> টুর্নামেন্ট <small id="tournamentBadge">নতুন</small></button><div class="king-shortcuts"><button onclick="navigate('balance')"><span>▣</span>ওয়ালেট</button><button onclick="document.getElementById('room').showModal()"><span>♧</span>বন্ধুদের রুম</button><button onclick="navigate('profile')"><span>☷</span>খেলার নিয়ম</button></div><p class="notice king-preview">লুডু আড্ডা · অনলাইন গেমিং</p>`;
else if(page==='auth')content.innerHTML=`<button class="back" onclick="navigate('home')">← ফিরে যাও</button><h1>লগইন / রেজিস্ট্রেশন</h1><div class="profile"><label>ফোন নম্বর<input id="authPhone" type="tel" placeholder="01XXXXXXXXX"></label><label>নাম<input id="authName" placeholder="আপনার নাম"></label><label>পাসওয়ার্ড<input id="authPass" type="password"></label><label>পাসওয়ার্ড নিশ্চিত করুন<input id="authConfirm" type="password"></label><div class="modes"><button class="primary" onclick="playerSignup()">সাইনআপ</button><button class="back" onclick="playerLogin()">লগইন</button></div><p id="authMessage" class="muted"></p></div>`;else if(page==='tournaments'){content.innerHTML=`<button class="back" onclick="navigate('home')">← ফিরে যাও</button><h1>টুর্নামেন্ট</h1><p class="muted">অ্যাডমিন প্রকাশিত টুর্নামেন্ট</p><div id="tournamentList" class="profile">লোড হচ্ছে…</div>`;fetch('https://ludu-aaddaa-1.onrender.com/api/tournaments').then(r=>r.json()).then(x=>{const e=document.getElementById('tournamentList');e.innerHTML=x.tournaments?.length?x.tournaments.map(t=>`<div class="card"><b>${t.name}</b><p class="muted">এন্ট্রি ফি: ৳ ${bn(t.entry_fee)} · পুরস্কার: ৳ ${bn(t.prize_pool)}</p><p class="muted">সর্বোচ্চ ${bn(t.max_players)} জন</p></div>`).join(''):'এখনো কোনো টুর্নামেন্ট নেই'}).catch(()=>document.getElementById('tournamentList').textContent='লোড করা যায়নি');}else if(page==='lobby')content.innerHTML=`<button class="back" onclick="navigate('home')">← ফিরে যাও</button><h1>তোমার টেবিল বেছে নাও</h1><p class="muted">সব অনুশীলন ম্যাচ বিনামূল্যে।</p><div class="card lobby"><div class="row"><span class="icon">⚄</span><span class="tag">প্রস্তুত</span></div><h2>দুইজনের অনুশীলন</h2><p class="muted">তুমি বনাম কম্পিউটার। পরিচিত বোর্ডে তোমার পরের চালটি অনুশীলন করো।</p><button class="primary full" onclick="startGame()">টেবিলে বসো →</button></div><div class="card lobby"><h2>বন্ধুদের রুম</h2><p class="muted">অনলাইন মাল্টিপ্লেয়ার এখনো যুক্ত হয়নি।</p><button class="back full" onclick="document.getElementById('room').showModal()">বিস্তারিত দেখো</button></div>`;
else if(page==='balance')content.innerHTML=`<p class="eyebrow">YOUR WALLET</p><h1>তোমার ওয়ালেট</h1><p class="muted">সব হিসাব, এক জায়গায়।</p><div class="wallet-hero"><span>মোট ব্যালেন্স</span><strong>৳ ${bn(balance)}<small>.০০</small></strong><span class="pill">আপনার বর্তমান ব্যালেন্স</span></div><div class="modes wallet-actions"><button class="card" onclick="toast('এটি ডিজাইন প্রিভিউ। টাকা জমা চালু নেই।')"><span class="icon">＋</span><b>টাকা যোগ</b><span class="muted">বিকাশ Send Money: 01670201266</span></button><button class="card" onclick="toast('এটি ডিজাইন প্রিভিউ। উত্তোলন চালু নেই।')"><span class="icon">↗</span><b>টাকা উত্তোলন</b><span class="muted">ডিজাইন প্রিভিউ</span></button></div><h2>লেনদেনের ইতিহাস</h2><div class="profile"><div class="empty-icon">↔</div><b>এখনো কোনো লেনদেন নেই</b><p class="muted">এই নমুনায় বাস্তব অর্থ লেনদেন করা হয় না।</p></div><p class="notice">প্রদর্শিত অর্থ বাস্তব ব্যালেন্স নয়।</p>`;
else if(page==='profile')content.innerHTML=`<div class="lk-profile-head"><button class="back" onclick="navigate('home')">←</button><div class="lk-avatar">☺<span class="lk-online"></span></div><h1>লুডু আড্ডা প্লেয়ার</h1><p class="muted">Player ID: ফোন নম্বর দিয়ে লগইন করুন</p><button class="lk-edit" onclick="navigate('auth')">প্রোফাইল / লগইন</button></div><div class="lk-level"><div class="row"><b>লেভেল ১</b><span>০ / ১০০ XP</span></div><div class="lk-progress"><i></i></div></div><div class="lk-stats"><div><b>০</b><small>জয়</small></div><div><b>০</b><small>ম্যাচ</small></div><div><b>০%</b><small>জয়ের হার</small></div><div><b>৳ ০</b><small>জিতেছেন</small></div></div><div class="lk-section"><h2>গেম সেটিংস</h2><div class="lk-row"><span>🔊 সাউন্ড</span><button onclick="toggleAudio('sound')">${soundOn?'চালু':'বন্ধ'}</button></div><div class="lk-row"><span>🎵 মিউজিক</span><button onclick="toggleAudio('music')">${musicOn?'চালু':'বন্ধ'}</button></div><div class="lk-row"><span>📳 ভাইব্রেশন</span><button onclick="toggleAudio('vibration')">${vibrationOn?'চালু':'বন্ধ'}</button></div></div><p class="notice">লুডু আড্ডা · Player profile</p>`;

async function playerLogin(){const phone=document.getElementById('authPhone').value,password=document.getElementById('authPass').value;const r=await fetch('https://ludu-aaddaa-1.onrender.com/api/player-auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phone,password})});const x=await r.json();if(x.success){localStorage.setItem('playerToken',x.token);navigate('home')}else document.getElementById('authMessage').textContent=x.message}async function playerSignup(){const phone=document.getElementById('authPhone').value,name=document.getElementById('authName').value,password=document.getElementById('authPass').value,confirmPassword=document.getElementById('authConfirm').value;const r=await fetch('https://ludu-aaddaa-1.onrender.com/api/player-auth/signup',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phone,name,password,confirmPassword})});const x=await r.json();document.getElementById('authMessage').textContent=x.success?'সাইনআপ সফল। এখন লগইন করুন।':x.message}
function save(){try{localStorage.setItem('luduDemoBalance',String(balance))}catch{}}
function checkTournamentNotifications(){fetch('https://ludu-aaddaa-1.onrender.com/api/tournaments').then(r=>r.json()).then(x=>{const b=document.getElementById('tournamentBadge');if(b)b.textContent=x.tournaments?.length?'নতুন':'কোনো নতুন নেই'}).catch(()=>{})}
function toast(s){document.querySelector('.toast')?.remove();let el=document.createElement('div');el.className='toast';el.role='status';el.textContent=s;document.body.append(el);setTimeout(()=>el.remove(),2500)}
const path=[[6,0],[6,1],[6,2],[6,3],[6,4],[6,5],[5,6],[4,6],[3,6],[2,6],[1,6],[0,6],[0,7],[0,8],[1,8],[2,8],[3,8],[4,8],[5,8],[6,9],[6,10],[6,11],[6,12],[6,13],[6,14],[7,14],[8,14],[8,13],[8,12],[8,11],[8,10],[8,9],[9,8],[10,8],[11,8],[12,8],[13,8],[14,8],[14,7],[14,6],[13,6],[12,6],[11,6],[10,6],[9,6],[8,5],[8,4],[8,3],[8,2],[8,1],[8,0],[7,0]];
function startGame(){startMusic();clearTimeout(timer);game={you:0,bot:0,dice:1,busy:false,done:false,youIn:false,botIn:false,message:'তোমার পালা। ডাইস চাপলে গুটি নিজে এগোবে।'};navigate('game')}
function playerCard(name,color,progress,active){return '<div class="player-card '+(active?'playing':'')+'"><span class="player-avatar '+color+'">'+(color==='blue'?'তু':'ক')+'</span><div><b>'+name+'</b><small>'+progress+'</small></div><span class="player-light"></span></div>'}
function renderGame(){content.innerHTML=`<div class="row"><button class="back" onclick="navigate('lobby')">← লবি</button><span class="tag">● অনুশীলন ম্যাচ</span><button class="back" onclick="document.getElementById('rulesDialog').showModal()" aria-label="খেলার নিয়ম">?</button></div><div class="match-heading"><span class="eyebrow">THE CLASSIC BOARD</span><h1>চলো, ছক্কা তুলি।</h1></div>${playerCard('কম্পিউটার','green',bn(game.bot)+' / ৫৭ ঘর',game.busy)}<div class="board-frame"><div class="board" id="board" aria-label="চার রঙের লুডু বোর্ড"></div></div>${playerCard('তুমি','blue',bn(game.you)+' / ৫৭ ঘর',!game.busy&&!game.done)}<div class="turn-panel"><div class="turn-copy"><span class="eyebrow">${game.done?'MATCH COMPLETE':game.busy?'OPPONENT TURN':'YOUR TURN'}</span><div class="status" role="status">${game.message}</div></div><button class="roll" onclick="roll()" ${game.busy||game.done?'disabled':''} aria-label="ডাইস ঘোরাও">${diceCube(game.dice,false)}</button></div>${game.done?'<button class="primary full" onclick="startGame()">আরেক দান খেলো →</button>':'<p class="notice">ডাইস চাপলে তোমার গুটি নিজে এগোবে</p>'}<dialog id="rulesDialog"><h2>অনুশীলনের নিয়ম</h2><p>এটি সরলীকৃত বোর্ড ডেমো। প্রতিপক্ষে একটি সচল গুটি, সরাসরি শুরু ও কাটাকাটি ছাড়া খেলা। ৫৭ ঘর শেষে পৌঁছাতে সঠিক সংখ্যা লাগবে। ঘরে থাকা বাকি গুটিগুলো সাজসজ্জা।</p><p class="muted">এই অনুশীলনে কোনো আর্থিক পুরস্কার নেই।</p><button class="primary full" onclick="document.getElementById('rulesDialog').close()">বুঝেছি</button></dialog>`;
let board=document.getElementById('board');for(let r=0;r<15;r++)for(let c=0;c<15;c++){let el=document.createElement('div');el.className='cell';if((r<6||r>8)&&(c<6||c>8))el.classList.add('yard-cell');if(r===7&&c>0&&c<6)el.classList.add('lane-red');if(c===7&&r>0&&r<6)el.classList.add('lane-green');if(r===7&&c>8&&c<14)el.classList.add('lane-yellow');if(c===7&&r>8&&r<14)el.classList.add('lane-blue');if([[6,1],[2,6],[1,8],[6,12],[8,13],[12,8],[13,6],[8,2]].some(p=>p[0]===r&&p[1]===c)){el.textContent='☆';el.classList.add('safe-cell')}board.append(el)}
for(const [color,position] of [['red','top-left'],['green','top-right'],['blue','bottom-left'],['yellow','bottom-right']]){let home=document.createElement('div');home.className='home-yard '+color+' '+position;home.innerHTML=((color==='green'||color==='blue')?'<span class="yard-label">'+(color==='blue'?'তুমি':'কম্পিউটার')+'</span>':'')+'<div class="home-inner">'+Array.from({length:4},(_,i)=>'<span class="parking">'+((color==='green'||color==='blue')&&i<4?'<i class="parked-token"></i>':'')+'</span>').join('')+'</div>';board.append(home)}let center=document.createElement('div');center.className='board-finish';center.innerHTML='<span>★</span>';board.append(center);for(const who of ['you','bot']){let token=document.createElement('span');token.id='moving-'+who;token.className='token '+(who==='bot'?'bot':'');token.setAttribute('aria-label',who==='you'?'তোমার গুটি':'কম্পিউটারের গুটি');placeToken(token,positionFor(who,game[who]));token.style.display=game[who]===0?'none':'block';board.append(token)}}
function diceCube(value,spinning){return '<span class="dice-scene" aria-hidden="true"><span class="dice-cube '+(spinning?'spinning':'')+'">'+['front','back','right','left','top','bottom'].map((face,j)=>'<span class="cube-face face-'+face+'">'+Array.from({length:9},(_,i)=>'<i class="'+(pipPositions[j===0?value:[1,6,2,5,3,4][j]].includes(i)?'pip':'')+'"></i>').join('')+'</span>').join('')+'</span></span>'}
const pipPositions={1:[4],2:[0,8],3:[0,4,8],4:[0,2,6,8],5:[0,2,4,6,8],6:[0,2,3,5,6,8]};
const FINISH=57;
function positionFor(who,progress){if(progress===FINISH)return [7,7];if(progress<51)return path[(progress+(who==='bot'?14:40))%52];let lane=progress-51;return who==='you'?[13-lane,7]:[1+lane,7]}
function placeToken(token,pos){token.style.left=((pos[1]+.5)/15*100)+'%';token.style.top=((pos[0]+.5)/15*100)+'%'}
function animateHop(token,from,to,current){return new Promise(resolve=>{let began;function frame(now){if(game!==current){resolve();return}if(began===undefined)began=now;const t=Math.min((now-began)/260,1);const ease=t*t*(3-2*t);placeToken(token,[from[0]+(to[0]-from[0])*ease,from[1]+(to[1]-from[1])*ease]);token.style.marginTop=(-5*Math.sin(Math.PI*t))+'px';if(t<1)requestAnimationFrame(frame);else{token.style.marginTop='0';resolve()}}requestAnimationFrame(frame)})}
async function step(who,current){const n=Math.floor(Math.random()*6)+1;game.dice=n;beep(520,.16);buzz(30);const name=who==='you'?'তুমি':'কম্পিউটার';game.message=name+' '+bn(n)+' তুলেছ।';renderGame();if(game[who]===0&&n<6){game.message=name+'-এর গুটি ঘরে আছে। গুটি বের করতে ৬ লাগবে।';return}if(game[who]===0&&n===6){game[who+'In']=true}if(game[who]+n>FINISH){game.message='শেষ ঘরে যেতে সঠিক সংখ্যা লাগবে।';return}const token=document.getElementById('moving-'+who);for(let i=1;i<=n;i++){const from=positionFor(who,current[who]);const to=positionFor(who,current[who]+1);await animateHop(token,from,to,current);beep(220,.07);buzz(18);if(game!==current)return;current[who]++;if(page==='game'){const status=document.querySelector('.status');if(status)status.textContent=name+' এগোচ্ছে · '+bn(i)+' / '+bn(n)+' ঘর';}}if(current[who]===FINISH){game.done=true;game.busy=false;game.message=who==='you'?'দারুণ! তুমি ম্যাচ জিতেছ।':'কম্পিউটার জিতেছে। আরেক দান হবে?';return}game.message=name+' '+bn(n)+' ঘর এগিয়েছে। '+(who==='you'?'কম্পিউটারের পালা…':'এবার তোমার পালা।')}
function animateDice(current){const cube=document.querySelector('.dice-cube');if(!cube)return Promise.resolve();return new Promise(resolve=>{let began;function frame(now){if(game!==current||page!=='game'){resolve();return}if(began===undefined)began=now;const t=Math.min((now-began)/950,1);const eased=1-Math.pow(1-t,2);cube.style.transform='rotateX('+(-17+720*eased)+'deg) rotateY('+(-23+1080*eased)+'deg)';cube.style.translate='0 '+(-12*Math.sin(Math.PI*t))+'px';if(t<1)requestAnimationFrame(frame);else{cube.style.translate='0 0';resolve()}}requestAnimationFrame(frame)})}
async function roll(){if(!game||game.busy||game.done)return;const current=game;game.busy=true;game.message='ডাইস ঘুরছে…';renderGame();await animateDice(current);if(game!==current||page!=='game'){if(game===current)game.busy=false;return}await step('you',current);if(game!==current)return;renderGame();if(game.done)return;await new Promise(resolve=>setTimeout(resolve,550));if(game!==current)return;if(page!=='game'){game.busy=false;return}game.message='কম্পিউটার ডাইস ঘোরাচ্ছে…';renderGame();await animateDice(current);if(game!==current)return;await step('bot',current);if(game!==current)return;game.busy=false;if(page==='game')renderGame()}
navigate('home');
async function finishLaunch(){const fontReady=document.fonts?document.fonts.ready:Promise.resolve();await Promise.all([new Promise(resolve=>setTimeout(resolve,1600)),Promise.race([fontReady,new Promise(resolve=>setTimeout(resolve,3000))])]);const splash=document.getElementById('splash');document.querySelector('.app').removeAttribute('inert');splash.classList.add('leaving');setTimeout(()=>splash.remove(),450)}
finishLaunch();

<!DOCTYPE html>
<html lang="bn">
<head>
<link rel="stylesheet" href="../shared/app-theme.css">
<link rel="stylesheet" href="../shared/reference-site-theme.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>লুডু গেম - লুডু আড্ডা</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/game.css">
</head>
<body>
    <div class="game-container">
        <header class="game-header">
            <button class="btn-back" onclick="leaveGame()"><i class="fas fa-arrow-left"></i> ছাড়ুন</button>
            <div class="room-info">
                <span>রুম: <strong id="roomCode"></strong></span> | 
                <span>বেট: <strong id="betAmount"></strong> ৳</span>
            </div>
            <div class="turn-info">
                <span id="turnIndicator">পালা লোড হচ্ছে...</span>
            </div>
        </header>

        <div class="game-board-container">
            <div class="players-info">
                <div class="player-card" id="playerBlue">
                    <div class="player-color blue"></div>
                    <div class="player-details">
                        <div class="player-name" id="blueName">প্লেয়ার ১</div>
                        <div class="pawns-count">গুটি: <span id="bluePawns">4/4</span></div>
                    </div>
                </div>
                <div class="player-card" id="playerGreen">
                    <div class="player-color green"></div>
                    <div class="player-details">
                        <div class="player-name" id="greenName">প্লেয়ার ২</div>
                        <div class="pawns-count">গুটি: <span id="greenPawns">4/4</span></div>
                    </div>
                </div>
            </div>

            <div class="board-wrapper">
                <div class="ludo-board" id="ludoBoard">
                    <!-- Board will be generated by JS -->
                </div>
            </div>

            <div class="game-controls">
                <div class="dice-container">
                    <div class="dice" id="dice" onclick="rollDice()">
                        <div class="dice-face">1</div>
                    </div>
                    <p id="diceText">ডাইস রোল করুন</p>
                </div>
                <div class="pawns-selector" id="pawnsSelector" style="display: none;">
                    <p>কোন গুটি চালাতে চান?</p>
                    <div class="pawn-options" id="pawnOptions"></div>
                </div>
            </div>
        </div>

        <div class="game-chat">
            <div class="chat-header">রুম চ্যাট</div>
            <div class="chat-messages" id="gameChatMessages"></div>
            <div class="chat-input">
                <input type="text" id="gameChatInput" placeholder="বার্তা লিখুন...">
                <button onclick="sendGameChat()"><i class="fas fa-paper-plane"></i></button>
            </div>
        </div>
    </div>

    <!-- Game Over Modal -->
    <div id="gameOverModal" class="modal">
        <div class="modal-content game-over">
            <h2 id="gameOverTitle">খেলা শেষ!</h2>
            <p id="gameOverMessage"></p>
            <button class="btn-primary" onclick="backToLobby()">লবি তে ফিরে যান</button>
        </div>
    </div>

    <script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
    <script src="js/game.js"></script>
</body>
</html>
